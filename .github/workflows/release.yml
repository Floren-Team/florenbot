name: Release

on:
  push:
    tags:
      - 'v*' # Запускається, коли ви робите тег v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    env: # Додайте цей блок
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with: { go-version: '1.22' }

      - name: Build binary
        run: go build -o florenbot ***REMOVED***

      - name: Install FPM
        run: gem install fpm

    - name: Create .deb package
        run: |
          # Створюємо структуру для сервісу
          mkdir -p build_root/etc/systemd/system/
          mkdir -p build_root/usr/bin/
          
          # Копіюємо бінарник та сервіс
          cp florenbot build_root/usr/bin/florenbot
          cp florenbot.service build_root/etc/systemd/system/
          
          # Збираємо пакет
          fpm -s dir -t deb -n florenbot -v ${{ github.ref_name }} \
          --description "Florenbot Telegram Bot" \
          --post-install postinst \
          --post-remove postrm \
          --before-remove prerm \
          -C build_root .

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSWORD }}

      - name: Sign .deb
        run: gpg --armor --detach-sign florenbot_${{ github.ref_name }}_amd64.deb

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            florenbot_${{ github.ref_name }}_amd64.deb
            florenbot_${{ github.ref_name }}_amd64.deb.asc